server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA con React Router: cualquier ruta desconocida la resuelve el cliente,
    # no nginx (sin esto, recargar /projects/:id/documents daria 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
