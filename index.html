<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: la app puede dibujar hasta el borde en dispositivos
         con notch/isla dinamica (requisito de Apple HIG para full-bleed); el
         padding real de esas zonas lo da env(safe-area-inset-*) en index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- theme-color (Material/Chrome): tinta la barra de estado/UI del
         navegador con el mismo color que el fondo de la app, en vez de
         dejar la barra por defecto del sistema. -->
    <meta name="theme-color" content="#031427" />
    <!-- Meta tags de Apple para instalar como app standalone en iOS
         (Apple HIG "Add to Home Screen"), con la barra de estado oscura a
         juego con el tema unico de la app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GENIAL" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <title>GENIAL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
